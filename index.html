<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>测测你是哪个AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@400;500;700;900&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* 版式：单列手机优先；首页像一段聊天记录，答题像和"人格识别模型"对话，结果是一张"模型卡" */
:root{
  --bg:#ECEEF2; --dot:#CDD2DB; --surface:#FFFFFF; --surface-2:#F5F6F9;
  --ink:#14161B; --muted:#646B7A; --line:#D4D8E0;
  --accent:#3651F5; --hl:#FFE14D; --hl-ink:#14161B;
  --f-display:"ZCOOL QingKe HuangYou","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --shadow:4px 4px 0 var(--ink);
  --radius:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101217; --dot:#252A34; --surface:#1A1D24; --surface-2:#22262F;
    --ink:#ECEEF3; --muted:#9AA2B1; --line:#2E3440;
    --accent:#8C9CFF; --hl:#FFD84D; --hl-ink:#14161B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101217; --dot:#252A34; --surface:#1A1D24; --surface-2:#22262F;
  --ink:#ECEEF3; --muted:#9AA2B1; --line:#2E3440;
  --accent:#8C9CFF; --hl:#FFD84D; --hl-ink:#14161B; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-body);
  font-size:16px; line-height:1.65;
  background-image:radial-gradient(var(--dot) 1.2px, transparent 1.3px);
  background-size:22px 22px;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.app{max-width:500px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
.screen{display:flex;flex-direction:column;gap:22px}

/* ---------- 通用 ---------- */
.btn{
  text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:2px solid var(--ink);border-radius:999px;background:var(--surface);
  padding:12px 22px;font-weight:700;font-size:16px;box-shadow:var(--shadow);
  transition:transform .12s, box-shadow .12s;
}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.hl{background:var(--hl);color:var(--hl-ink)}
.btn.small{padding:8px 14px;font-size:14px;box-shadow:3px 3px 0 var(--ink)}
.btn.ghost{box-shadow:none;border-color:var(--line);background:transparent}
.btn.ghost:hover{border-color:var(--ink);transform:none}
.mono{font-family:var(--f-mono)}
.eyebrow{font-family:var(--f-body);font-size:12px;letter-spacing:.06em;color:var(--muted)}
.card{background:var(--surface);border:2px solid var(--ink);border-radius:var(--radius);box-shadow:var(--shadow)}

/* ---------- 首页 ---------- */
.hero{display:flex;flex-direction:column;gap:14px;padding-top:12px}
.hero h1{
  font-family:var(--f-display);font-weight:400;font-size:clamp(46px,14vw,68px);
  line-height:1.02;margin:0;letter-spacing:.01em;text-wrap:balance;
}
.hero h1 .mark{background:var(--hl);color:var(--hl-ink);padding:0 .12em;border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.cursor{display:inline-block;width:.42em;height:.9em;background:var(--accent);vertical-align:-.08em;margin-left:.08em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hero p{margin:0;color:var(--muted);font-size:15px}
.meta-row{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-family:var(--f-body);font-size:12px;border:1.5px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--surface);color:var(--muted)}

.preview{padding:16px;display:flex;flex-direction:column;gap:12px}
.preview-head{display:flex;justify-content:space-between;align-items:center}
.msg{display:flex;gap:10px;align-items:flex-start}
.ava{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:19px;border:2px solid var(--ink);background:var(--surface-2)}
.msg .who{font-size:12px;color:var(--muted);font-family:var(--f-mono);margin-bottom:2px}
.bubble{background:var(--surface-2);border:1.5px solid var(--line);border-radius:4px 16px 16px 16px;padding:9px 13px;font-size:14.5px;line-height:1.6;min-width:0}
.msg>div{min-width:0}
.preview .msg{opacity:1;transition:opacity .4s}
.start-wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.start-wrap .btn{font-size:18px;padding:15px 22px}
.start-note{font-size:13px;color:var(--muted);text-align:center}

.dex-title{display:flex;justify-content:space-between;align-items:baseline}
.dex-title h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0}
.dex-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dex-item{
  display:flex;gap:10px;align-items:center;text-align:left;
  background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;
  transition:border-color .15s, transform .15s;
}
.dex-item:hover{border-color:var(--ink);transform:translateY(-2px)}
.dex-item .dot{flex:none;width:34px;height:34px;border-radius:10px;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:18px}
.dex-item b{display:block;font-size:14px;line-height:1.3}
.dex-item span{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.dex-item>div{min-width:0}
.dex-item.locked{border-style:dashed}
.foot{font-size:12px;color:var(--muted);line-height:1.7;text-align:center;padding-top:6px}

/* ---------- 答题 ---------- */
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px}
.qbar-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.progress{height:10px;border:2px solid var(--ink);border-radius:999px;background:var(--surface);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s ease}
.counter{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.counter b{color:var(--ink);font-size:15px}
.chat{display:flex;flex-direction:column;gap:14px}
.bot-name{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.bot-name .tag{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.qbubble{font-size:17.5px;font-weight:500;line-height:1.65;padding:14px 16px;border-radius:4px 18px 18px 18px;background:var(--surface);border:2px solid var(--ink)}
.qbubble.special{background:var(--hl);color:var(--hl-ink)}
.typing{display:inline-flex;gap:4px;padding:16px 18px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.prev{opacity:.55;display:flex;flex-direction:column;gap:8px}
.prev .qbubble{font-size:14px;font-weight:400;border-width:1.5px;border-color:var(--line);padding:9px 12px}
.me{align-self:flex-end;max-width:88%;background:var(--ink);color:var(--bg);border-radius:18px 4px 18px 18px;padding:9px 14px;font-size:14.5px}
.opts{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.opt{
  text-align:left;border:2px solid var(--ink);border-radius:16px;background:var(--surface);
  padding:12px 14px 12px 12px;font-size:15.5px;line-height:1.55;display:flex;gap:10px;align-items:flex-start;
  box-shadow:3px 3px 0 var(--ink);transition:transform .1s, box-shadow .1s, background .15s;
}
.opt .k{flex:none;font-family:var(--f-mono);font-weight:700;font-size:13px;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;border:1.5px solid var(--ink);margin-top:1px}
.opt:hover{background:var(--surface-2)}
.opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.opt.sel{background:var(--hl);color:var(--hl-ink)}
.opt.sel .k{background:var(--hl-ink);color:var(--hl);border-color:var(--hl-ink)}
.opt>span:last-child{min-width:0}
.hint{font-size:12.5px;color:var(--muted);text-align:center}

/* ---------- 结果 ---------- */
.res-tag{display:flex;justify-content:center}
.res-tag span{font-weight:700;font-size:12.5px;letter-spacing:.06em;border:1.5px solid var(--ink);border-radius:999px;padding:4px 12px;background:var(--hl);color:var(--hl-ink)}
.model{overflow:hidden}
.model-head{padding:22px 20px 18px;color:var(--tc-ink);background:var(--tc);display:flex;flex-direction:column;gap:12px;position:relative}
.model-head::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.18) 1.2px,transparent 1.3px);background-size:16px 16px;pointer-events:none}
.mh-top{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;z-index:1}
.mh-top span{font-size:12px;opacity:.85;letter-spacing:.06em}
.mh-main{display:flex;gap:16px;align-items:center;position:relative;z-index:1}
.big-ava{flex:none;width:84px;height:84px;border-radius:24px;background:var(--surface);border:2px solid var(--ink);display:grid;place-items:center;font-size:46px;box-shadow:3px 3px 0 var(--ink)}
.mh-main>div{min-width:0}
.mh-code{font-family:var(--f-mono);font-weight:700;font-size:15px;opacity:.9}
.mh-name{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,10vw,46px);line-height:1.05;margin:2px 0 0}
.match{position:relative;z-index:1;display:inline-flex;align-self:flex-start;gap:8px;align-items:center;background:var(--surface);color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.model-body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:18px}
.say{position:relative;background:var(--surface-2);border:2px solid var(--ink);border-radius:4px 18px 18px 18px;padding:12px 15px;font-size:16px;font-weight:500;line-height:1.65}
.say::before{content:"口头禅";display:block;font-size:11px;color:var(--muted);font-weight:400;margin-bottom:2px;letter-spacing:.06em}
.desc{margin:0;font-size:15.5px;line-height:1.85}
.sec-t{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.sec-t small{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.05em}
.scenes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.scenes li{display:flex;gap:10px;font-size:15px;line-height:1.6}
.scenes li::before{content:"›";font-family:var(--f-mono);font-weight:700;color:var(--tc-text)}
.pb{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pb>div{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.pb .eyebrow{display:block;margin-bottom:2px}
.pb p{margin:0;font-size:14.5px;line-height:1.55}

.params{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.param{background:var(--surface-2);border-radius:12px;padding:10px 10px 9px;min-width:0}
.param .eyebrow{font-size:10.5px;letter-spacing:.04em;display:block}
.param b{display:block;font-family:var(--f-mono);font-size:19px;line-height:1.3;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.param span{display:block;font-size:11.5px;color:var(--muted);line-height:1.4}

.dims{display:flex;flex-direction:column;gap:14px}
.dgroup h4{margin:0 0 6px;font-size:13px;font-family:var(--f-mono);color:var(--muted);font-weight:500;letter-spacing:.05em}
.drow{display:grid;grid-template-columns:5.2em 54px minmax(0,1fr);gap:10px;align-items:center;padding-block:5px;border-top:1px dashed var(--line)}
.drow:first-of-type{border-top:0}
.drow .dn{font-size:14px;font-weight:700}
.segs{display:flex;gap:3px}
.segs i{flex:1;height:12px;border-radius:3px;background:var(--line)}
.segs i.on{background:var(--tc-text)}
.drow .dc{font-size:13.5px;color:var(--muted);line-height:1.45}
.drow .lv{font-family:var(--f-mono);font-weight:700;font-size:12px;color:var(--ink);margin-right:4px}

.alts{display:flex;flex-direction:column;gap:8px}
.alt{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface)}
.alt:hover{border-color:var(--ink)}
.alt>div{flex:1;min-width:0}
.alt b{font-size:15px}
.alt span{display:block;font-size:12.5px;color:var(--muted)}
.alt .av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:19px;border:2px solid var(--ink)}
.alt .pct{font-family:var(--f-mono);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair .alt{flex-direction:column;align-items:flex-start;gap:4px}
.pair .alt .eyebrow{font-size:11px}
/* 并列结果：两张可切换的模型卡 */
.twin{display:flex;flex-direction:column;gap:10px;align-items:center}
.twin-hint{margin:0;font-size:13.5px;color:var(--muted);text-align:center;text-wrap:balance}
.twin-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.twin-tab{display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;border:2px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);padding:9px 12px;font-weight:700;font-size:15px;transition:background .15s,border-color .15s,box-shadow .15s}
.twin-tab span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.twin-tab:hover{border-color:var(--ink);color:var(--ink)}
.twin-tab[aria-selected="true"]{background:var(--tab-bg);color:var(--tab-ink);border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.twin-stage{touch-action:pan-y}
.twin-dots{display:flex;justify-content:center;gap:6px;margin-top:-8px}
.twin-dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .15s,width .15s}
.twin-dots i.on{width:18px;border-radius:4px;background:var(--ink)}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions .wide{grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;transition:all .25s;z-index:50;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- 弹层 ---------- */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(10,12,16,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{width:100%;max-width:500px;max-height:88vh;overflow:auto;background:var(--surface);border:2px solid var(--ink);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1.5px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.sheet-body{padding:16px;display:flex;flex-direction:column;gap:14px}
.x{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.share-img{width:100%;border-radius:14px;border:1.5px solid var(--line);display:block}
.copybox{font-size:13.5px;background:var(--surface-2);border-radius:12px;padding:10px 12px;line-height:1.6;user-select:all;-webkit-user-select:all}
.dex-detail .model-head{border-radius:14px}
.dex-detail .mh-name{font-size:clamp(28px,8.4vw,38px)}
.model{--tc-text:var(--tc-l)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .model{--tc-text:var(--tc-d)}}
:root[data-theme="dark"] .model{--tc-text:var(--tc-d)}
.confirm-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

@media (min-width:640px){
  .app{padding-block:40px 64px}
  .dex-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .overlay{align-items:center}
}
@media (max-width:360px){
  .params{grid-template-columns:repeat(2,minmax(0,1fr))}
  .drow{grid-template-columns:4.6em 44px minmax(0,1fr)}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
.fade-in{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>

<main class="app">
  <!-- ========== 首页 ========== -->
  <section class="screen" id="home">
    <div class="hero">
      <span class="eyebrow">AI 人格识别模型 · v1.0</span>
      <h1>测测你是<br><span class="mark">哪个 AI</span><span class="cursor" aria-hidden="true"></span></h1>
      <p>你是会“稳稳接住你”的 GPT，还是“想太多”的 DeepSeek？是嘴甜的豆包，还是顺手把项目重构了的 Claude Code？31 道题，测出你的 AI 本体。</p>
      <div class="meta-row">
        <span class="pill">14 种 AI 人格</span>
        <span class="pill">2 个隐藏结局</span>
        <span class="pill">15 个维度</span>
        <span class="pill">约 4 分钟</span>
      </div>
    </div>

    <div class="card preview" aria-label="示例对话">
      <div class="preview-head"><span class="eyebrow">群聊 · AI 们都在</span><span class="eyebrow" id="pvCount">3 人正在输入…</span></div>
      <div id="pvList" style="display:flex;flex-direction:column;gap:12px"></div>
    </div>

    <div class="start-wrap">
      <button class="btn primary" id="startBtn">开始对话 →</button>
      <div class="start-note">题目没有对错，按第一反应选就好</div>
    </div>

    <div class="dex-title"><h2>AI 人格图鉴</h2><span class="eyebrow">点开看看</span></div>
    <div class="dex-grid" id="dexGrid"></div>

    <p class="foot">纯属娱乐，请勿当真<br>各 AI 的形象来自网友吐槽与公开报道，与相关公司无关</p>
  </section>

  <!-- ========== 答题 ========== -->
  <section class="screen" id="quiz" hidden>
    <div class="qbar">
      <div class="qbar-row">
        <button class="btn small ghost" id="backBtn">↩ 上一题</button>
        <span class="counter"><b id="qNow">1</b> / <span id="qTotal">31</span></span>
        <button class="btn small ghost" id="quitBtn">退出</button>
      </div>
      <div class="progress" aria-hidden="true"><i id="bar"></i></div>
    </div>
    <div class="chat" id="chat" aria-live="polite"></div>
    <div class="opts" id="opts"></div>
  </section>

  <!-- ========== 结果 ========== -->
  <section class="screen" id="result" hidden></section>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><b id="sheetTitle">标题</b><button class="x" id="closeSheet" aria-label="关闭">×</button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script id="quiz-data">
/* ================= 维度 ================= */

<script>
(function(){
"use strict";
var $ = function(s){return document.querySelector(s)};
var LV = {L:1,M:2,H:3}, LVN = ["","L","M","H"];
var ALL = TYPES.concat([FALLBACK,HIDDEN]);

/* ---------- 颜色工具：决定卡片上用白字还是黑字 ---------- */
function lum(hex){var n=parseInt(hex.slice(1),16),r=(n>>16)/255,g=(n>>8&255)/255,b=(n&255)/255;
  var f=function(c){return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4)};return .2126*f(r)+.7152*f(g)+.0722*f(b);}
function cr(a,b){var x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
function inkOn(hex){return cr(hex,"#FFFFFF")>=cr(hex,"#14161B")?"#FFFFFF":"#14161B";}
function mix(hex,to,t){var a=parseInt(hex.slice(1),16),b=parseInt(to.slice(1),16);var c=[16,8,0].map(function(sh){var x=a>>sh&255,y=b>>sh&255;return Math.round(x+(y-x)*t);});return "#"+c.map(function(v){return ("0"+v.toString(16)).slice(-2);}).join("");}
function readable(hex,bg,toward){var t=0,c=hex;while(cr(c,bg)<3.2&&t<1){t+=.05;c=mix(hex,toward,t);}return c;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;}return a;}
function toast(msg){var t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove("show")},1800);}

/* ---------- 图鉴 ---------- */

  return '<button class="dex-item'+(locked?' locked':'')+'" data-id="'+t.id+'"><span class="dot" style="background:'+t.color+';color:'+inkOn(t.color)+'">'+(locked?'?':t.emoji)+'</span><div><b>'+esc(locked?'隐藏结局':t.code)+'</b><span>'+esc(locked?'达成条件未知':t.name)+'</span></div></button>';
}
function renderDex(){
  var h = TYPES.map(function(t){return dexItem(t,false)}).join("");
  h += dexItem(FALLBACK,true).replace('data-id="siri"','data-id="lock-a"');

renderDex();
$("#dexGrid").addEventListener("click",function(e){

  if(id==="lock-b"){ openSheet("隐藏结局 · ？", '<p class="desc">答题途中会遇到一道特殊的验证题。认真回答它，也许会发现另一个结局。</p>'); return; }
  showTypeSheet(byId[id]);
});
function showTypeSheet(t){
  var html = '<div class="dex-detail model" style="--tc:'+t.color+';--tc-ink:'+inkOn(t.color)+'">'+
    '<div class="model-head"><div class="mh-main"><div class="big-ava">'+t.emoji+'</div><div><div class="mh-code">'+esc(t.code)+'</div><div class="mh-name">'+esc(t.name)+'</div></div></div></div></div>'+
    '<div class="say">'+esc(t.say)+'</div><p class="desc">'+esc(t.desc)+'</p>'+
    '<div class="pb"><div><span class="eyebrow">超能力</span><p>'+esc(t.power)+'</p></div><div><span class="eyebrow">已知 bug</span><p>'+esc(t.bug)+'</p></div></div>';
  openSheet(t.code+" · "+t.name, html);
}

/* ---------- 弹层 ---------- */
var lastFocus=null;
function openSheet(title, html){
  lastFocus=document.activeElement;
  $("#sheetTitle").textContent=title; $("#sheetBody").innerHTML=html; $("#overlay").hidden=false;
  $("#closeSheet").focus();
}
function closeSheet(){ $("#overlay").hidden=true; $("#sheetBody").innerHTML=""; if(lastFocus&&lastFocus.focus) lastFocus.focus(); }
$("#closeSheet").addEventListener("click",closeSheet);
$("#overlay").addEventListener("click",function(e){ if(e.target===this) closeSheet(); });
document.addEventListener("keydown",function(e){
  if($("#overlay").hidden) return;
  if(e.key==="Escape"){ closeSheet(); return; }
  if(e.key==="Tab"){
    var f=Array.prototype.filter.call($(".sheet").querySelectorAll("button,a[href],[tabindex]"),function(x){return x.offsetParent!==null;});
    if(!f.length) return;
    var a=f[0], z=f[f.length-1];
    if(e.shiftKey && document.activeElement===a){ e.preventDefault(); z.focus(); }
    else if(!e.shiftKey && document.activeElement===z){ e.preventDefault(); a.focus(); }
    else if(!$(".sheet").contains(document.activeElement)){ e.preventDefault(); a.focus(); }
  }
});

/* ---------- 答题流程 ---------- */
var seq=[], answers=[], cur=0, busy=false, pending=null;
function cancelPending(){ if(pending){ clearTimeout(pending); pending=null; } busy=false; }
function buildSeq(){
  var qs = shuffle(QUESTIONS.map(function(q,i){q.i=i;return q;}));
  var pos = 8 + Math.floor(Math.random()*14);   /* 人机验证题插在第 9~22 题之间，不会排第一 */
  qs.splice(pos,0,SPECIAL_1);
  return qs.map(function(q){ return {q:q, order:q.sp?q.o.map(function(_,i){return i}):shuffle([0,1,2])}; });
}
function show(id){ ["home","quiz","result"].forEach(function(s){ $("#"+s).hidden = (s!==id); }); window.scrollTo(0,0); }
function start(){ cancelPending(); seq=buildSeq(); answers=[]; cur=0; show("quiz"); renderQ(false); }
$("#startBtn").addEventListener("click",start);
$("#quitBtn").addEventListener("click",function(){
  if(busy) return;
  if(cur<3){ cancelPending(); show("home"); return; }
  openSheet("确定退出吗？",'<p class="desc">你已经答到第 '+(cur+1)+' 题，退出后进度会清空。</p><div class="confirm-row"><button class="btn" id="stayBtn">继续答题</button><button class="btn primary" id="leaveBtn">退出</button></div>');
  $("#stayBtn").addEventListener("click",closeSheet);
  $("#leaveBtn").addEventListener("click",function(){ cancelPending(); closeSheet(); show("home"); });
});
$("#backBtn").addEventListener("click",function(){
  if(busy) return;
  if(cur===0){ show("home"); return; }
  cur--; renderQ(false);
});

function renderQ(withTyping){
  var item=seq[cur], q=item.q;
  $("#qNow").textContent=cur+1; $("#qTotal").textContent=seq.length;
  $("#bar").style.width = (cur/seq.length*100)+"%";
  $("#backBtn").textContent = cur===0 ? "↩ 首页" : "↩ 上一题";
  var prevHtml="";
  if(cur>0 && answers[cur-1]!=null){
    var pi=seq[cur-1]; prevHtml='<div class="prev"><div class="me">'+esc(pi.q.o[answers[cur-1]][0])+'</div></div>';
  }
  var head='<div class="bot-name"><span>人格识别模型</span><span class="tag">'+(q.sp?'补充题':'第 '+(cur+1)+' 题')+'</span></div>';
  var chat=$("#chat");
  var bubble='<div class="qbubble'+(q.sp?' special':'')+'">'+esc(q.t)+'</div>';
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  $("#opts").innerHTML="";
  if(withTyping && !reduce){
    chat.innerHTML = prevHtml + head + '<div class="qbubble typing" aria-label="正在输入"><i></i><i></i><i></i></div>';
    setTimeout(function(){ if(seq[cur]===item){ chat.innerHTML = prevHtml + head + bubble.replace('class="qbubble','class="qbubble fade-in'); renderOpts(item); } }, 420);
  } else {
    chat.innerHTML = prevHtml + head + bubble; renderOpts(item);
  }
}
function renderOpts(item){
  var keys="ABCD", sel=answers[cur];
  $("#opts").innerHTML = item.order.map(function(oi,k){
    return '<button class="opt fade-in'+(sel===oi?' sel':'')+'" data-oi="'+oi+'" style="animation-delay:'+(k*60)+'ms"><span class="k">'+keys[k]+'</span><span>'+esc(item.q.o[oi][0])+'</span></button>';
  }).join("");
  var first=$("#opts .opt"); if(first && document.activeElement && document.activeElement.classList && (document.activeElement.classList.contains("opt")||document.activeElement===document.body)){ try{ first.focus({preventScroll:true}); }catch(e){} }
}
$("#opts").addEventListener("click",function(e){
  var b=e.target.closest(".opt"); if(!b||busy) return;
  var oi=+b.getAttribute("data-oi"), item=seq[cur];
  answers[cur]=oi;
  Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(x){x.classList.toggle("sel",x===b)});
  /* 人机验证题的分支 */
  if(item.q.sp===1){
    var hasNext = seq[cur+1] && seq[cur+1].q.sp===2;
    if(oi===3 && !hasNext){ seq.splice(cur+1,0,{q:SPECIAL_2,order:[0,1]}); answers.splice(cur+1,0,null); }
    if(oi!==3 && hasNext){ seq.splice(cur+1,1); answers.splice(cur+1,1); }
  }
  busy=true;
  pending=setTimeout(function(){
    pending=null; busy=false;
    if($("#quiz").hidden) return;
    if(cur < seq.length-1){ cur++; renderQ(true); }
    else { $("#bar").style.width="100%"; finish(); }
  }, 260);
});

/* ---------- 计分与匹配（对标 SBTI） ---------- */
function compute(){
  var raw={}; DIMS.forEach(function(d){raw[d.k]=0;});
  var hidden=false;
  seq.forEach(function(it,i){
    var a=answers[i]; if(a==null) return;
    if(it.q.sp===2 && a===1) hidden=true;
    if(!it.q.sp) raw[it.q.d]+=it.q.o[a][1];
  });
  var lv = DIMS.map(function(d){ var s=raw[d.k]; return s<=3?1:(s===4?2:3); });
  var rank = TYPES.map(function(t){
    var dist=0, hit=0;
    for(var i=0;i<15;i++){ var df=Math.abs(lv[i]-t.v[i]); dist+=df; if(df===0) hit++; }
    return {t:t, dist:dist, hit:hit, sim:Math.round((1-dist/30)*100)};
  }).sort(function(a,b){ return a.dist-b.dist || b.hit-a.hit; });
  var best=rank[0], res;
  if(hidden) res={type:HIDDEN, badge:"匹配度 100% · 人机验证未通过", tag:"隐藏人格已激活", sim:100};
  else if(best.sim<60) res={type:FALLBACK, badge:"标准 AI 人格库最高匹配仅 "+best.sim+"%", tag:"系统强制兜底", sim:best.sim};
  else res={type:best.t, badge:"匹配度 "+best.sim+"% · 精准命中 "+best.hit+"/15 维", tag:"你的 AI 人格", sim:best.sim};
  res.raw=raw; res.lv=lv; res.rank=rank;
  return res;
}
window.__aiQuiz = {compute:compute, TYPES:TYPES, DIMS:DIMS};

/* ---------- 模型参数（由你的维度原始分换算，纯属娱乐） ---------- */
function params(raw){
  var r=function(k){return raw[k]-2}; /* 0~4 */
  var temp = (0.2 + (r("O3")+r("T3")+r("S2"))/12*1.6).toFixed(1);
  var hallu = Math.round(3 + r("T3")/4*72 + (4-r("T2"))/4*20);
  var ctxList=["4K","8K","32K","128K","200K","1M","1M","2M","2M"];
  var ctx = ctxList[r("O1")+r("T1")];
  var refuse = Math.round(1 + r("S1")/4*44);
  var busyR = Math.round(1 + r("A3")/4*88);
  var sweetList=["无糖","无糖","三分糖","三分糖","半糖","半糖","全糖","全糖","齁甜"];
  var sweet = sweetList[r("E1")+r("E2")];
  return [
    {k:"温度",v:temp,s:temp>=1.2?"放飞自我":(temp>=0.7?"偶有灵感":"稳如老狗")},
    {k:"幻觉率",v:hallu+"%",s:hallu>=60?"张口就来":(hallu>=30?"偶尔编一点":"字字有据")},
    {k:"上下文窗口",v:ctx,s:"能记住的废话长度"},
    {k:"拒答率",v:refuse+"%",s:refuse>=30?"道德感很强":"基本有求必应"},
    {k:"服务器繁忙",v:busyR+"%",s:busyR>=50?"经常转圈圈":"秒回选手"},
    {k:"情绪价值",v:sweet,s:"含糖量"}
  ];
}

/* ---------- 结果页 ---------- */
var lastRes=null;
function finish(){ lastRes=compute(); renderResult(lastRes); show("result"); }
/* 并列：匹配度百分比与第一名相同的 AI，按现有排序取前两个（只影响展示，不改匹配规则） */
function twinOf(res){
  if(res.type===HIDDEN || res.type===FALLBACK) return null;
  var top=res.rank.filter(function(r){ return r.sim===res.rank[0].sim; }).slice(0,2);
  return top.length===2 ? top : null;
}
/* 当前展示的那一个结果：并列时随切换变化，分享图和复制结果都用它 */
function viewOf(res, i){
  var tw=res.twin;
  if(!tw) return {type:res.type, badge:res.badge, raw:res.raw, lv:res.lv, combo:""};
  var r=tw[i];
  return {type:r.t, badge:"匹配度 "+r.sim+"% · 精准命中 "+r.hit+"/15 维", raw:res.raw, lv:res.lv,
          combo:tw[0].t.code+"+"+tw[1].t.code};
}
function modelCardHtml(t, badge, ps, dimsHtml, extra){
  var ink=inkOn(t.color);
  var tcL=readable(t.color,"#FFFFFF","#000000"), tcD=readable(t.color,"#1A1D24","#FFFFFF");
  return '<article class="card model fade-in"'+(extra||'')+' style="--tc:'+t.color+';--tc-ink:'+ink+';--tc-l:'+tcL+';--tc-d:'+tcD+'">'+
      '<div class="model-head">'+
        '<div class="mh-top"><span>模型卡 · 你的 AI 本体</span><span class="mono">'+new Date().toISOString().slice(0,10)+'</span></div>'+
        '<div class="mh-main"><div class="big-ava">'+t.emoji+'</div><div><div class="mh-code">'+esc(t.code)+'</div><h2 class="mh-name">'+esc(t.name)+'</h2></div></div>'+
        '<span class="match">'+esc(badge)+'</span>'+
      '</div>'+
      '<div class="model-body">'+
        '<div class="say">'+esc(t.say)+'</div>'+
        '<p class="desc">'+esc(t.desc)+'</p>'+
        '<div><h3 class="sec-t">名场面</h3><ul class="scenes">'+t.scenes.map(function(s){return '<li>'+esc(s)+'</li>'}).join("")+'</ul></div>'+
        '<div class="pb"><div><span class="eyebrow">超能力</span><p>'+esc(t.power)+'</p></div><div><span class="eyebrow">已知 bug</span><p>'+esc(t.bug)+'</p></div></div>'+
        '<div><h3 class="sec-t">你的模型参数 <small>由答题结果换算</small></h3><div class="params">'+
          ps.map(function(p){return '<div class="param"><span class="eyebrow">'+p.k+'</span><b>'+esc(p.v)+'</b><span>'+esc(p.s)+'</span></div>'}).join("")+
        '</div></div>'+
        '<div><h3 class="sec-t">十五维人格扫描</h3><div class="dims">'+dimsHtml+'</div></div>'+
      '</div>'+
    '</article>';
}
function pairHtml(t){
  var fr=byId[t.friend], rv=byId[t.rival];
  return '<div class="pair">'+
    '<button class="alt" data-id="'+fr.id+'"><span class="eyebrow">最佳搭子</span><b>'+fr.emoji+' '+esc(fr.code)+'</b><span>'+esc(fr.name)+'</span></button>'+
    '<button class="alt" data-id="'+rv.id+'"><span class="eyebrow">相爱相杀</span><b>'+rv.emoji+' '+esc(rv.code)+'</b><span>'+esc(rv.name)+'</span></button></div>';
}
function bindAlts(root){
  Array.prototype.forEach.call(root.querySelectorAll(".alt"),function(b){
    b.addEventListener("click",function(){ showTypeSheet(byId[b.getAttribute("data-id")]); });
  });
}
function renderResult(res){
  var t=res.type;
  res.twin=twinOf(res); res.view=0;
  var ps=params(res.raw);
  var dimsHtml = GROUPS.map(function(g,gi){
    var rows = DIMS.map(function(d,i){ return {d:d,i:i}; }).filter(function(x){return x.d.g===gi;}).map(function(x){
      var l=res.lv[x.i];
      return '<div class="drow"><span class="dn">'+x.d.n+'</span><span class="segs" aria-label="'+LVN[l]+'"><i class="on"></i><i class="'+(l>=2?'on':'')+'"></i><i class="'+(l>=3?'on':'')+'"></i></span><span class="dc"><span class="lv">'+LVN[l]+'</span>'+esc(x.d.c[l-1])+'</span></div>';
    }).join("");
    return '<div class="dgroup"><h4>'+g+'</h4>'+rows+'</div>';
  }).join("");
  var shownTypes = res.twin ? [res.twin[0].t, res.twin[1].t] : [t];
  var alts = res.rank.filter(function(r){return shownTypes.indexOf(r.t)<0;}).slice(0,3).map(function(r){
    return '<button class="alt" data-id="'+r.t.id+'"><span class="av" style="background:'+r.t.color+';color:'+inkOn(r.t.color)+';border-color:var(--ink)">'+r.t.emoji+'</span><div><b>'+esc(r.t.code)+' · '+esc(r.t.name)+'</b><span>'+esc(r.t.say.slice(0,26))+'…</span></div><span class="pct">'+r.sim+'%</span></button>';
  }).join("");
  var cardsHtml;
  if(res.twin){
    var tw=res.twin;
    cardsHtml =
      '<div class="twin fade-in">'+
        '<p class="twin-hint">你和两个 AI 的匹配度一样，点名字或左右滑动切换</p>'+
        '<div class="twin-tabs" role="tablist" aria-label="切换匹配结果">'+
          tw.map(function(r,i){ return '<button class="twin-tab" role="tab" id="twinTab'+i+'" aria-controls="twinCard'+i+'" aria-selected="'+(i===0)+'" tabindex="'+(i===0?0:-1)+'" data-i="'+i+'" style="--tab-bg:'+r.t.color+';--tab-ink:'+inkOn(r.t.color)+'">'+r.t.emoji+'<span>'+esc(r.t.code)+'</span></button>'; }).join("")+
        '</div>'+
      '</div>'+
      '<div class="twin-stage" id="twinStage">'+
        tw.map(function(r,i){ var v=viewOf(res,i); return modelCardHtml(r.t, v.badge, ps, dimsHtml, ' role="tabpanel" id="twinCard'+i+'" aria-labelledby="twinTab'+i+'"'+(i===0?'':' hidden')); }).join("")+
      '</div>'+
      '<div class="twin-dots" aria-hidden="true"><i class="on"></i><i></i></div>';
  } else {
    cardsHtml = modelCardHtml(t, res.badge, ps, dimsHtml);
  }
  var tag = res.twin ? res.tag+"："+res.twin[0].t.code+"+"+res.twin[1].t.code : res.tag;
  var html =
    '<div class="res-tag fade-in"><span>'+esc(tag)+'</span></div>'+
    cardsHtml+
    '<div><h3 class="sec-t">你也有点像</h3><div class="alts">'+alts+'</div></div>'+
    '<div><h3 class="sec-t">AI 关系网</h3><div id="pairBox">'+pairHtml(t)+'</div></div>'+
    '<div class="actions">'+
      '<button class="btn hl wide" id="shareBtn">生成分享图</button>'+
      '<button class="btn" id="copyBtn">复制结果</button>'+
      '<button class="btn" id="againBtn">再测一次</button>'+
      '<button class="btn ghost wide" id="homeBtn">看全部 AI 图鉴</button>'+
    '</div>'+
    '<p class="foot">纯属娱乐，请勿当真 · 各 AI 的形象来自网友吐槽与公开报道，与相关公司无关</p>';
  $("#result").innerHTML = html;
  $("#shareBtn").addEventListener("click",function(){ makeShare(viewOf(res,res.view)); });
  $("#copyBtn").addEventListener("click",function(){ copyResult(viewOf(res,res.view)); });
  $("#againBtn").addEventListener("click",start);
  $("#homeBtn").addEventListener("click",function(){ show("home"); setTimeout(function(){ $("#dexGrid").scrollIntoView({behavior:"smooth",block:"start"}); },50); });
  bindAlts($("#result"));
  if(res.twin) bindTwin(res);
}
/* 并列卡片的切换：点名字、键盘左右键、在卡片上左右滑动 */
function bindTwin(res){
  var tabs=document.querySelectorAll("#result .twin-tab");
  var cards=document.querySelectorAll("#twinStage .model");
  var dots=document.querySelectorAll("#result .twin-dots i");
  function go(i, focusTab){
    if(i===res.view) return;
    res.view=i;
    Array.prototype.forEach.call(tabs,function(b,k){ b.setAttribute("aria-selected", k===i); b.tabIndex = k===i?0:-1; });
    Array.prototype.forEach.call(cards,function(c,k){ c.hidden = k!==i; if(k===i){ c.classList.remove("fade-in"); void c.offsetWidth; c.classList.add("fade-in"); } });
    Array.prototype.forEach.call(dots,function(d,k){ d.classList.toggle("on",k===i); });
    var box=$("#pairBox"); box.innerHTML=pairHtml(res.twin[i].t); bindAlts(box);
    if(focusTab) tabs[i].focus();
  }
  Array.prototype.forEach.call(tabs,function(b){
    b.addEventListener("click",function(){ go(+b.getAttribute("data-i")); });
    b.addEventListener("keydown",function(e){
      if(e.key==="ArrowRight"||e.key==="ArrowLeft"){ e.preventDefault(); go(res.view===0?1:0, true); }
    });
  });
  var stage=$("#twinStage"), sx=null, sy=0;
  stage.addEventListener("pointerdown",function(e){ if(e.pointerType==="mouse") return; sx=e.clientX; sy=e.clientY; });
  stage.addEventListener("pointercancel",function(){ sx=null; });
  stage.addEventListener("pointerup",function(e){
    if(sx===null) return;
    var dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5){
      if(dx<0 && res.view===0) go(1);
      else if(dx>0 && res.view===1) go(0);
    }
  });
}

function shareText(res){
  var t=res.type;
  return "我测出来最像的 AI 是【"+(res.combo || (t.code+" · "+t.name))+"】，"+res.badge.split(" · ")[0]+"！\n“"+t.say+"”\n你最像哪个 AI？来「测测你是哪个 AI」试试。";
}
function copyResult(res){
  var txt=shareText(res);
  var done=function(){toast("已复制，去粘贴给朋友吧");};
  var fallback=function(){ openSheet("复制结果",'<p class="desc" style="font-size:14px">自动复制没成功，长按或拖选下面的文字手动复制：</p><div class="copybox">'+esc(txt).replace(/\n/g,"<br>")+'</div>'); };
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,fallback); } else fallback(); }catch(e){ fallback(); }
}

/* ---------- 分享图（原生 Canvas 绘制，不依赖外部库） ---------- */
/* 分行：标点不放行首、前引号不放行尾。放不下时把行尾几个字连同标点一起挪到下一行，每行都按实际字体量宽，不超宽 */
function wrapLines(ctx, text, maxW){
  var NO_START="，。！？、；：”’）》…～,.!?;:)‍️", NO_END="“‘（《(";
  var chars=Array.from(text), lines=[], line=[];
  for(var i=0;i<chars.length;i++){
    var s=line.concat(chars[i]);
    if(!line.length || ctx.measureText(s.join("")).width<=maxW){ line=s; continue; }
    var k=line.length;
    while(k>0 && (NO_START.indexOf(s[k])>-1 || NO_END.indexOf(s[k-1])>-1)) k--;
    if(k===0) k=line.length;
    lines.push(s.slice(0,k).join("")); line=s.slice(k);
  }
  if(line.length) lines.push(line.join("")); return lines;
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function makeShare(res){
  var go=function(){
    var t=res.type, W=1080, c=document.createElement("canvas"); c.width=W; c.height=10; var ctx=c.getContext("2d");
    var DISP='"ZCOOL QingKe HuangYou","PingFang SC","Microsoft YaHei",sans-serif', BODY='"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif', MONO='"JetBrains Mono",Menlo,Consolas,monospace';
    var ink=inkOn(t.color), cx=60, cy=res.combo?236:140, cw=W-120, inner=cw-120;
    /* 先量尺寸 */
    ctx.font='500 40px '+BODY; var sayLines=wrapLines(ctx,"“"+t.say+"”",inner-72).slice(0,4);
    var bh=sayLines.length*62+64;
    var halfW=(inner-24)/2; ctx.font='500 32px '+BODY;
    var pLines=wrapLines(ctx,t.power,halfW-56).slice(0,3), gLines=wrapLines(ctx,t.bug,halfW-56).slice(0,3);
    var pbH=Math.max(pLines.length,gLines.length)*46+92;
    var ySay=cy+410, yPar=ySay+bh+40, yPB=yPar+150+40, yDim=yPB+pbH+60, cardBottom=yDim+260;
    var ch=cardBottom-cy, H=cardBottom+190;
    c.height=H; ctx=c.getContext("2d");
    /* 背景 */
    ctx.fillStyle=t.color; ctx.fillRect(0,0,W,H);
    ctx.fillStyle= ink==="#FFFFFF" ? "rgba(255,255,255,.16)" : "rgba(0,0,0,.12)";
    for(var y=20;y<H;y+=36) for(var x=20;x<W;x+=36){ ctx.beginPath(); ctx.arc(x,y,2.4,0,Math.PI*2); ctx.fill(); }
    ctx.fillStyle=ink; ctx.font='500 34px '+BODY; ctx.textBaseline="top";
    ctx.fillText(res.type===HIDDEN?"人机验证结果——":(res.type===FALLBACK?"系统没能识别我，只好把我分给了——":"我在「测测你是哪个 AI」里测出来是——"),72,72);
    /* 并列时：引导语下方写 A+B */
    if(res.combo){
      var cs=80; ctx.font=cs+'px '+DISP;
      while(ctx.measureText(res.combo).width>W-144 && cs>40){ cs-=4; ctx.font=cs+'px '+DISP; }
      ctx.fillText(res.combo,72,124);
    }
    ctx.textBaseline="alphabetic";
    /* 卡片 */
    ctx.fillStyle= lum(t.color)<0.05 ? "#FFE14D" : "#14161B"; rr(ctx,cx+12,cy+12,cw,ch,44); ctx.fill();
    ctx.fillStyle="#FFFFFF"; rr(ctx,cx,cy,cw,ch,44); ctx.fill();
    ctx.lineWidth=5; ctx.strokeStyle="#14161B"; rr(ctx,cx,cy,cw,ch,44); ctx.stroke();
    /* 头像 + 名字 */
    ctx.fillStyle=t.color; rr(ctx,cx+60,cy+64,200,200,52); ctx.fill(); ctx.stroke();
    ctx.font='120px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillStyle="#14161B"; ctx.fillText(t.emoji,cx+160,cy+170);
    ctx.textAlign="left"; ctx.textBaseline="alphabetic";
    ctx.fillStyle="#646B7A"; ctx.font='700 40px '+MONO; ctx.fillText(t.code,cx+300,cy+130);
    ctx.fillStyle="#14161B"; var nameSize=t.name.length>5?92:108; ctx.font=nameSize+'px '+DISP; ctx.fillText(t.name,cx+296,cy+246);
    /* 匹配度 */
    ctx.font='600 30px '+BODY; var badge=res.badge; var bw=Math.min(ctx.measureText(badge).width+56, inner);
    ctx.fillStyle="#FFE14D"; rr(ctx,cx+60,cy+306,bw,60,30); ctx.fill(); ctx.lineWidth=3; ctx.stroke();
    ctx.fillStyle="#14161B"; ctx.fillText(badge,cx+88,cy+347);
    /* 口头禅 */
    ctx.fillStyle="#F2F3F6"; rr(ctx,cx+60,ySay,inner,bh,32); ctx.fill(); ctx.lineWidth=3; ctx.stroke();
    ctx.fillStyle="#14161B"; ctx.font='500 40px '+BODY; sayLines.forEach(function(l,i){ ctx.fillText(l,cx+96,ySay+76+i*62); });
    /* 参数 */
    var ps=params(res.raw).filter(function(p){return ["温度","幻觉率","情绪价值"].indexOf(p.k)>-1;});
    var pw=(inner-40)/3;
    ps.forEach(function(p,i){
      var px=cx+60+i*(pw+20);
      ctx.fillStyle="#F2F3F6"; rr(ctx,px,yPar,pw,150,26); ctx.fill();
      ctx.fillStyle="#646B7A"; ctx.font='500 28px '+BODY; ctx.fillText(p.k,px+28,yPar+52);
      ctx.fillStyle="#14161B"; ctx.font='700 52px '+(/[\u4e00-\u9fa5]/.test(p.v)?BODY:MONO); ctx.fillText(p.v,px+28,yPar+120);
    });
    /* 超能力 / 已知 bug */
    [["超能力",pLines],["已知 bug",gLines]].forEach(function(it,i){
      var px=cx+60+i*(halfW+24);
      ctx.lineWidth=3; ctx.strokeStyle="#D4D8E0"; rr(ctx,px,yPB,halfW,pbH,26); ctx.stroke();
      ctx.fillStyle="#646B7A"; ctx.font='500 26px '+BODY; ctx.fillText(it[0],px+28,yPB+46);
      ctx.fillStyle="#14161B"; ctx.font='500 32px '+BODY; it[1].forEach(function(l,j){ ctx.fillText(l,px+28,yPB+96+j*46); });
    });
    ctx.strokeStyle="#14161B";
    /* 十五维条带 */
    ctx.fillStyle="#646B7A"; ctx.font='500 28px '+BODY; ctx.fillText("十五维人格扫描",cx+60,yDim);
    var gw=(inner-14*10)/15;
    res.lv.forEach(function(l,i){
      var bx=cx+60+i*(gw+10), full=150, hh=full*l/3;
      ctx.fillStyle="#ECEEF2"; rr(ctx,bx,yDim+30,gw,full,10); ctx.fill();
      ctx.fillStyle=t.color; rr(ctx,bx,yDim+30+full-hh,gw,hh,10); ctx.fill();
    });
    ctx.fillStyle="#9AA0AD"; ctx.font='500 24px '+BODY; ctx.textAlign="center";
    ["情绪","表达","思考","行动","立场"].forEach(function(g,gi){ ctx.fillText(g, cx+60+gi*3*(gw+10)+(3*gw+20)/2, yDim+222); });
    ctx.textAlign="left";
    /* 页脚 */
    ctx.fillStyle=ink; ctx.font='64px '+DISP; ctx.fillText("测测你是哪个 AI",72,H-92);
    ctx.font='500 28px '+BODY; ctx.globalAlpha=.85; ctx.fillText("14 种 AI 人格 · 2 个隐藏结局 · 纯属娱乐",72,H-44); ctx.globalAlpha=1;
    var url=c.toDataURL("image/png");
    var framed = (function(){ try{ return window.self!==window.top; }catch(e){ return true; } })();
    openSheet("分享图",
      '<img class="share-img" src="'+url+'" alt="'+esc(t.code+" · "+t.name+" 结果分享图")+'">'+
      '<p class="start-note">手机长按图片保存，电脑右键“图片另存为”</p>'+
      (framed?'':'<a class="btn primary" id="dlBtn" href="'+url+'" download="我是'+esc(t.code)+'.png">下载图片</a>')
    );
  };
  if(document.fonts && document.fonts.ready){ Promise.race([document.fonts.ready, new Promise(function(r){setTimeout(r,1500)})]).then(go); } else go();
}
})();
